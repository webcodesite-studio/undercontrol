name = "pants-r2-upload"
main = "worker.js"
compatibility_date = "2025-01-01"

[[r2_buckets]]
binding = "PANTS_BUCKET"
bucket_name = "pants-images"

[vars]
PUBLIC_BASE_URL = "https://TWOJ-PUBLICZNY-URL-R2.pl"
SUPABASE_URL = "https://TWOJ-PROJEKT.supabase.co"
SUPABASE_ANON_KEY = "TWOJ_ANON_KEY"          # publiczny klucz anon (ten sam co w config.js)
ALLOWED_ORIGINS = "https://twoja-domena.pl"  # domena strony, po przecinku; dla testów lokalnych dodaj http://localhost:8765
ADMIN_EMAILS = "twoj@mail.pl"                # e-maile adminów dopuszczonych do uploadu, po przecinku
